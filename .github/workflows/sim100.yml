name: Simulación de 100 terrenos
on:
  push:
    branches: [mejoras-v2]
    paths: [pruebas/sim100.py, .github/workflows/sim100.yml]
permissions:
  contents: write
jobs:
  simular:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: (node pruebas/servidor.mjs &) && sleep 3 && cd pruebas && python sim100.py 2>&1 | tee sim-log.txt
      - name: Guardar resultados en la rama pruebas-sim100
        if: always()
        run: |
          cd pruebas && mkdir -p salida && cp sim-log.txt salida/ || true
          cd salida && git init -q && git checkout -q -b pruebas-sim100
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json && git add -A && git commit -qm "Simulación 100 terrenos $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pruebas-sim100
