name: Datos climáticos ARClim
on:
  workflow_dispatch:
  push:
    branches: [mejoras-v2]
    paths: [scripts/arclim.mjs, .github/workflows/arclim.yml]
permissions:
  contents: write
jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/arclim.mjs 2>&1 | tee arclim-log.txt
      - name: Guardar datos en la rama
        run: |
          mkdir -p public/clima && cp arclim-log.txt public/clima/log.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/clima
          git commit -m "Datos climáticos ARClim generados automáticamente" || echo "sin cambios"
          git push
