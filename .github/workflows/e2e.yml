name: Prueba de punta a punta
on:
  workflow_dispatch:
  push:
    branches: [mejoras-v2]
    paths: [pruebas/**, src/**, api/**, .github/workflows/e2e.yml]
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: (node pruebas/servidor.mjs &) && sleep 3 && cd pruebas && python e2e.py 2>&1 | tee e2e-log.txt
      - name: Guardar resultados en la rama pruebas-e2e
        if: always()
        run: |
          cd pruebas && cp e2e-log.txt salida/ || true
          cd salida && git init -q && git checkout -q -b pruebas-e2e
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Resultados e2e $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pruebas-e2e
