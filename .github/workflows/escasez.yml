name: Decretos de escasez vigentes (DGA)
on:
  schedule:
    - cron: "17 11 * * 1"
  push:
    branches: [mejoras-v2]
    paths: [scripts/escasez.mjs, .github/workflows/escasez.yml]
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/escasez.mjs
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add public/escasez.json
          git diff --cached --quiet || (git commit -qm "Decretos de escasez vigentes actualizados desde la DGA" && git push)
